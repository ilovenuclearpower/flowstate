name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-13
            platform: macos-x86_64
          - os: macos-latest
            platform: macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build TUI
        run: nix build .#tui --out-link result-tui

      - name: Build Server
        run: nix build .#server --out-link result-server

      - name: Prepare release artifacts
        run: |
          cp result-tui/bin/flowstate flowstate-${{ matrix.platform }}
          cp result-server/bin/flowstate-server flowstate-server-${{ matrix.platform }}
          chmod +x flowstate-${{ matrix.platform }} flowstate-server-${{ matrix.platform }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            flowstate-${{ matrix.platform }}
            flowstate-server-${{ matrix.platform }}
