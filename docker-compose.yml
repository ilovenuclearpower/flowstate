services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowstate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowstate}
      POSTGRES_DB: ${POSTGRES_DB:-flowstate}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowstate}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    image: ghcr.io/ilovenuclearpower/flowstate-server:latest
    ports:
      - "${FLOWSTATE_PORT:-3710}:3710"
    environment:
      FLOWSTATE_DB_BACKEND: postgres
      FLOWSTATE_DATABASE_URL: "postgres://${POSTGRES_USER:-flowstate}:${POSTGRES_PASSWORD:-flowstate}@db:5432/${POSTGRES_DB:-flowstate}"
      FLOWSTATE_PORT: "3710"
      FLOWSTATE_BIND: "0.0.0.0"
    volumes:
      - server-config:/root/.config/flowstate
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  runner:
    image: ghcr.io/ilovenuclearpower/flowstate-runner:latest
    environment:
      FLOWSTATE_SERVER_URL: http://server:3710
      FLOWSTATE_RUNNER_CAPABILITY: ${FLOWSTATE_RUNNER_CAPABILITY:-standard}
      FLOWSTATE_AGENT_BACKEND: ${FLOWSTATE_AGENT_BACKEND:-claude-cli}
      FLOWSTATE_MAX_CONCURRENT: ${FLOWSTATE_MAX_CONCURRENT:-2}
      FLOWSTATE_MAX_BUILDS: ${FLOWSTATE_MAX_BUILDS:-1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - runner-config:/home/flowstate/.config/flowstate
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres-data:
  server-config:
  runner-config:
